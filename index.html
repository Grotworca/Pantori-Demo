<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000000"><meta name="description" content="Pantori - solo puzzle demo"><title>Pantori</title><link rel="stylesheet" href="style.css"></head><body>
<header><a class="brand" href="./"><span class="brand-icon">P</span>PANTORI<span class="demo">DEMO</span></a><div class="language"><span data-i18n="change"></span><div id="languages"></div></div><button id="rulesBtn" class="quiet" data-i18n="how"></button></header>
<main><section class="intro"><div><p class="eyebrow" data-i18n="tagline"></p><h1 data-i18n="headline"></h1><p data-i18n="intro"></p></div><div class="journey" id="journey"></div></section>
<div class="game-layout"><section class="board-panel"><div class="board-heading"><div><p class="eyebrow" id="stage"></p><h2 id="levelTitle"></h2></div><span class="fruit-badge" id="fruitCount"></span></div><div class="board-wrap"><div id="board" role="group"><img id="boardArt" alt=""><svg id="overlay" viewBox="0 0 800 800" aria-hidden="true"></svg><div id="grid"></div></div></div><div class="board-footer"><span data-i18n="noTime"></span><span id="piecesCount"></span></div></section>
<aside><section class="tool-panel"><p class="eyebrow" data-i18n="equipment"></p><h2 data-i18n="piecesTitle"></h2><p class="muted" data-i18n="selectHelp"></p><div id="tray"></div><p class="rotation-help" data-i18n="rotateHelp"></p><div class="selected-label" id="selectedLabel"></div><div class="transform"><button id="rotate" disabled>↻ <span data-i18n="rotate"></span></button><button id="flip" disabled>⇆ <span data-i18n="flip"></span></button></div><p class="placement-help" data-i18n="anchorHelp"></p><div class="clear-actions"><button id="remove" class="quiet" data-i18n="remove" disabled></button><button id="clear" data-i18n="clear"></button></div></section><div class="undo-panel"><button id="undo" disabled>↶ <span data-i18n="undo"></span></button></div></aside></div>
<p id="feedback" role="status" aria-live="polite"></p><footer><span>PANTORI · <span data-i18n="author"></span></span><span data-i18n="footer"></span></footer></main>
<dialog id="rules" aria-labelledby="guideTitle"><div class="guide-top"><p class="eyebrow" id="guideCount"></p><div id="guideLanguages" class="guide-languages"></div></div><h2 id="guideTitle" tabindex="-1"></h2><div class="guide-visual"><img id="guideImage" alt=""><div id="guideControlsArt" aria-hidden="true">↻ &nbsp; ⇆ &nbsp; ↶</div></div><p id="guideDescription" aria-live="polite"></p><button id="animationToggle"></button><div class="guide-actions"><div class="guide-navigation"><button id="guidePrev"></button><button id="guideNext" class="primary"></button></div><button id="guideExit" class="primary wide"></button></div></dialog>
<dialog id="win"><p class="eyebrow" id="winEyebrow"></p><div class="win-art">✦</div><h2 id="winTitle"></h2><p id="winText"></p><button id="next" class="primary wide"></button><button id="stay" class="quiet wide" data-i18n="stay"></button></dialog>
<script src="levels.js"></script><script src="engine.js"></script><script src="i18n.js"></script><script src="app.js"></script></body></html>
